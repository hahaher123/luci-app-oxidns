name: Build packages

# 复用型工作流：用官方 OpenWrt SDK 编译 LuCI 包。
#
# 产物是 OpenWrt 25.12 的 apk —— apk-tools 3 的 ADB 容器格式，与官方 feed 里的
# 包同格式，因此设备上的 `apk add` 与 ImageBuilder 的 `apk mkndx` / `apk add`
# 都能直接用。（此前用 scripts/build-luci-package.sh 在本地拼出来的包是
# apk-tools 2.x 风格：能装在设备上，但过不了 ImageBuilder 建索引这一关，
# 所以拼进自建镜像时会失败。）
#
# 由 ci.yml 与 release.yml 共同调用：CI 里用来确认「改完还编得出来」，发版时
# 作为发布产物的唯一来源 —— 两条路径共用同一份编译逻辑，不会各自漂移。
on:
  workflow_call:

env:
  # 编译用 SDK。只决定用哪套工具链，产物是 PKGARCH=all 的架构无关包。
  SDK_ARCH: x86_64-25.12.5
  # 本仓库被挂载为 SDK 的一个 feed，此名即输出目录名
  FEED_NAME: oxidns
  # 要编译的包目录。luci-i18n-oxidns-* 翻译包在同一个目录里定义，会一并产出。
  BUILD_PACKAGES: luci-app-oxidns
  ARTIFACT_NAME: luci-app-oxidns-apk

jobs:
  build:
    name: 编译 apk
    runs-on: ubuntu-latest
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/share/dotnet /usr/share/swift
          df -h / | tail -n 1

      # 本仓库是扁平布局（Makefile/htdocs/po/root 都在根目录），而 OpenWrt 的 feed
      # 扫描（`find feeds/<名> -mindepth 1 -name Makefile`）只认 feed 根目录下的
      # 一级子目录，根目录自身的 Makefile 不算一个包。
      # 所以把代码签出到子目录 luci-app-oxidns/ 里，让工作区本身成为合法的
      # feed 根目录，再通过 FEED_DIR 交给 SDK 动作挂载为 /feed。
      - uses: actions/checkout@v7
        with:
          path: luci-app-oxidns

      - name: 使用 OpenWrt SDK 编译
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ env.SDK_ARCH }}
          FEEDNAME: ${{ env.FEED_NAME }}
          PACKAGES: ${{ env.BUILD_PACKAGES }}
          FEED_DIR: ${{ github.workspace }}
          V: s

      - name: 收集编译产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          echo "--- bin/packages 下的目录 ---"
          find bin/packages -maxdepth 3 -type d | head -n 40 || true

          # 只收本应用与它的翻译包：编译 luci-app-oxidns 时 SDK 会把依赖也编出来，
          # 那些是架构相关包，对别的架构没用，也不该混进发布资产。
          find bin/packages -type f \
            \( -name 'luci-app-oxidns-*.apk' -o -name 'luci-i18n-oxidns-*.apk' \) \
            -exec cp -v {} dist/ \;

          if ! ls dist/luci-app-oxidns-*.apk >/dev/null 2>&1; then
            echo "::error::SDK 没有产出 luci-app-oxidns 的 apk"
            ls -R bin/packages | head -n 60 || true
            exit 1
          fi
          if ! ls dist/luci-i18n-oxidns-*.apk >/dev/null 2>&1; then
            echo "::error::SDK 没有产出 luci-i18n-oxidns-* 翻译包"
            ls -R bin/packages | head -n 60 || true
            exit 1
          fi
          echo "--- dist ---"
          ls -l dist/

      - name: 校验产物格式与内容
        shell: bash
        env:
          # 代码签出在子目录里，Makefile 要显式指定
          PKG_MAKEFILE: luci-app-oxidns/Makefile
          # SDK 自带的 apk（x86_64 linux 二进制），用来走一遍 ImageBuilder
          # 拼装时的 mkndx 路径
          APK_BIN: staging_dir/host/bin/apk
        run: luci-app-oxidns/scripts/release-check.sh "" dist

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*.apk
            dist/sha256sums.txt
          if-no-files-found: error
