name: Release

# 发布规则：Makefile 里的 PKG_VERSION / PKG_RELEASE 变更并推到 main 后，
# 自动编译并发布 Release（tag = v<PKG_VERSION>-r<PKG_RELEASE>，如 v0.1.4-r4），
# Release 说明取自触发这次变更的 commit 信息（即「commit 为本次变动内容」）。
# tag 已存在时跳过（幂等，不会覆盖已有 Release）。
#
# 编译走 .github/workflows/build-packages.yml（官方 OpenWrt SDK），产物是
# OpenWrt 25.12 的 apk（apk-tools 3 的 ADB 容器格式），设备上的 apk 与
# ImageBuilder 都能直接用。
#
# 手动 dispatch（可显式给版本）与推 tag 触发保留。
on:
  push:
    branches:
      - main
    paths:
      - "Makefile"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本（v0.1.4 或 v0.1.4-r4）；留空则按 Makefile 的 PKG_VERSION/PKG_RELEASE 生成'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    name: 解析版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.value }}
      build: ${{ steps.guard.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 显式给版本（v0.1.2 或 v0.1.2-r2）就用它；其余情况（push、dispatch 留空、推 tag）
          # 一律以 Makefile 为准 —— Makefile 是包版本的唯一事实源，release-check.sh 会再校验一次。
          # 推 tag 的场景 checkout 在 tag commit 上，Makefile 与 tag 一致，两种取法等价。
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION}" ]; then
            value="${INPUT_VERSION}"
          else
            v="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n1)"
            r="$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -n1)"
            value="v${v}-r${r}"
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "tag: ${value}"

      - name: Skip when the tag already exists
        id: guard
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "tag ${TAG} already exists, nothing to release"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "tag ${TAG} is new, proceeding"
          fi

  packages:
    name: 编译 apk
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build-packages.yml

  release:
    name: 发布 Release
    needs: [prepare, packages]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 下载编译产物
        uses: actions/download-artifact@v8
        with:
          name: luci-app-oxidns-apk
          path: dist

      - name: 再校验一次产物（顺带确认 tag 与 Makefile 一致）
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: scripts/release-check.sh "$TAG" dist

      - name: Collect release notes from the commit message
        id: body
        shell: bash
        run: |
          set -euo pipefail
          # Release 说明 = 最近一次改动 Makefile（即版本变更）的 commit 信息全文
          # （约定：commit 描述本次变动内容）。补发旧版本时也能取到对应的变更说明。
          {
            echo "body<<RELEASE_NOTES_EOF"
            git log -1 --pretty=format:'%B' -- Makefile
            echo ""
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body: ${{ steps.body.outputs.body }}
          files: |
            dist/*.apk
            dist/sha256sums.txt
