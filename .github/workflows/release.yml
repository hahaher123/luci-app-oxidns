name: Release

# 发布规则：Makefile 里的 PKG_VERSION / PKG_RELEASE 变更并推到 main 后，
# 自动编译并发布 Release（tag = v<PKG_VERSION>-r<PKG_RELEASE>，如 v0.1.4-r4），
# Release 说明取自触发这次变更的 commit 信息（即「commit 为本次变动内容」）。
#
# 编译的唯一路径就是这里 —— ci.yml 不再编译，所以一次版本变更只编一次。
#
# 两道闸门都在「解析版本」任务里，任一不满足就整条流水线跳过：
#   1) 版本没动 —— 拿这次 push 前的提交与当前提交比 PKG_VERSION/PKG_RELEASE，
#      两者都没变就跳过。只改 Makefile 注释之类的 push 不会白编一次。
#   2) tag 已存在 —— 幂等，不会覆盖已有 Release（重跑失败任务、补发旧版本时用）。
on:
  push:
    branches:
      - main
    paths:
      - "Makefile"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本（v0.1.4 或 v0.1.4-r4）；留空则按 Makefile 的 PKG_VERSION/PKG_RELEASE 生成'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    name: 解析版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.value }}
      # 先看这次 push 有没有改版本号，再看 tag 是不是新的：都成立才编译发版。
      # 顺序不能反 —— 版本没变时不用去问远端 tag 存不存在（少一次网络请求）。
      build: ${{ steps.changed.outputs.build == 'true' && steps.guard.outputs.build == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 显式给版本（v0.1.2 或 v0.1.2-r2）就用它；其余情况（push、dispatch 留空、推 tag）
          # 一律以 Makefile 为准 —— Makefile 是包版本的唯一事实源，release-check.sh 会再校验一次。
          # 推 tag 的场景 checkout 在 tag commit 上，Makefile 与 tag 一致，两种取法等价。
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION}" ]; then
            value="${INPUT_VERSION}"
          else
            v="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n1)"
            r="$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -n1)"
            value="v${v}-r${r}"
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "tag: ${value}"

      # 「版本号变动后自动编译」的核心判定：版本没动就不编。
      # 为什么不能只靠 tag 判断：push 的 paths 过滤只认「Makefile 被改了」，
      # 改个注释也会命中，那时 tag 还是新的，照样会白编一次。
      # 这里直接比对这次 push 前后的 PKG_VERSION / PKG_RELEASE：
      #   - 单提交 push：GITHUB_SHA^ 就是推送前的提交，即「这一提交有没有改版本号」。
      #   - 多提交 push：before 是推送前的最后一个提交，仍能正确判定。
      #   - dispatch / 推 tag：没有 before 可比，跳过这层（由 tag 幂等把关）。
      - name: Skip when the package version did not change
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          version_of() {
            local rev="$1"
            local v r
            v="$(git show "${rev}:Makefile" 2>/dev/null | sed -n 's/^PKG_VERSION:=//p' | head -n1)"
            r="$(git show "${rev}:Makefile" 2>/dev/null | sed -n 's/^PKG_RELEASE:=//p' | head -n1)"
            echo "${v}-r${r}"
          }

          if [ "${EVENT_NAME}" != "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "${EVENT_NAME}: 无推送前提交可比，交由 tag 幂等判断"
            exit 0
          fi

          # 首次推送（before 全 0）或 before 取不到时，保守起见按「变了」处理。
          if [ -z "${BEFORE:-}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "无法确定推送前的版本，按已变更处理"
            exit 0
          fi

          prev="$(version_of "${BEFORE}")"
          curr="$(version_of HEAD)"
          echo "推送前: ${prev}"
          echo "当前:   ${curr}"

          if [ "${prev}" = "${curr}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "PKG_VERSION/PKG_RELEASE 没变，不编译"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "版本从 ${prev} 变为 ${curr}，开始编译"
          fi

      - name: Skip when the tag already exists
        id: guard
        if: steps.changed.outputs.build == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "tag ${TAG} already exists, nothing to release"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "tag ${TAG} is new, proceeding"
          fi

  packages:
    name: 编译 apk
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build-packages.yml

  release:
    name: 发布 Release
    needs: [prepare, packages]
    # 只卡「版本有没有变」这道闸门，不要求 packages 成功 —— 否则「版本号变了但
    # 这次提交没动代码」（比如提交流转、重发已发布过的版本内容）会因为 packages
    # 被跳过而跟着不发。产物这时是空的，发出去的 Release 只带说明与 tag。
    if: always() && needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 下载编译产物
        if: needs.packages.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: luci-app-oxidns-apk
          path: dist

      # packages 被跳过（版本号变了但这次提交没改代码）时没有产物可下。
      # packages 失败时则必须拦下来 —— 那种情况发出去的 Release 是坏的。
      - name: 确认编译结果
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.packages.result }}
        run: |
          set -euo pipefail
          echo "编译任务结果: ${BUILD_RESULT}"
          case "${BUILD_RESULT}" in
            success)
              ls -l dist/ ;;
            skipped)
              echo "::notice::本次没有需要编译的改动，发布一个不带产物的版本记录" ;;
            *)
              echo "::error::编译任务结果异常（${BUILD_RESULT}），中止发布"
              exit 1 ;;
          esac

      - name: 再校验一次产物（顺带确认 tag 与 Makefile 一致）
        if: needs.packages.result == 'success'
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: scripts/release-check.sh "$TAG" dist

      - name: Collect release notes from the commit message
        id: body
        shell: bash
        run: |
          set -euo pipefail
          # Release 说明 = 最近一次改动 Makefile（即版本变更）的 commit 信息全文
          # （约定：commit 描述本次变动内容）。补发旧版本时也能取到对应的变更说明。
          {
            echo "body<<RELEASE_NOTES_EOF"
            git log -1 --pretty=format:'%B' -- Makefile
            echo ""
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body: ${{ steps.body.outputs.body }}
          files: |
            dist/*.apk
            dist/sha256sums.txt
