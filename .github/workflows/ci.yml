name: CI

# 只做静态检查与 rpcd 契约测试，秒级完成，不拉 SDK、不编译。
#
# 编译与发布只有一条路径：release.yml（Makefile 的 PKG_VERSION / PKG_RELEASE
# 变更并推到 main 后编译一次、发一次 Release）。CI 以前还会额外编一次 apk，
# 于是每次发版提交都会同时触发 CI 与 Release 两条编译流水线 —— 同一份代码
# 编两遍。现在 CI 不再编译，发版就是唯一一次编译。
#
# PR 与手动触发都会跑检查；push 时只检查会影响行为的路径，纯文档改动不跑。
on:
  pull_request:
    paths:
      - "Makefile"
      - "htdocs/**"
      - "root/**"
      - "po/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "Makefile"
      - "htdocs/**"
      - "root/**"
      - "po/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  check:
    name: 静态与契约检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run static checks
        run: scripts/check.sh

      - name: Run integration checks
        run: scripts/integration-check.sh
