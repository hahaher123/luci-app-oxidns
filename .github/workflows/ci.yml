name: CI

# push / PR 时跑两件事：
#   1) check —— 静态检查与 rpcd 契约测试，秒级完成；
#   2) packages —— 用官方 SDK 真编一次 apk，确认改动还编得出来、产物仍是
#      apk-tools 3 的 ADB 容器格式（见 .github/workflows/build-packages.yml）。
#
# packages 只在会影响到包内容的路径变动时跑：每次 push 都拉一套 SDK 不划算，
# 而只改 README 之类的改动本来也编不出不一样的东西。push 触发的发版提交
# （动了 Makefile）不重复编译 —— release.yml 会编译并发布。
on:
  pull_request:
    paths:
      - "Makefile"
      - "htdocs/**"
      - "root/**"
      - "po/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    # 注意：这里的 paths 刻意不含 Makefile。改 Makefile 就是发版，而 release.yml
    # 同样监听 Makefile，它会编译一次并把产物发出去 —— CI 再编一次纯属重复。
    # pull_request 那边保留 Makefile，因为 PR 不会触发 release.yml。
    paths:
      - "htdocs/**"
      - "root/**"
      - "po/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  check:
    name: 静态与契约检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run static checks
        run: scripts/check.sh

      - name: Run integration checks
        run: scripts/integration-check.sh

  packages:
    name: 编译 apk
    needs: check
    # 发版提交动了 Makefile，release.yml 会编译一次并发布产物 —— CI 再编一次纯属
    # 重复（2026-09-22 起路径过滤拆不掉这种重叠：发版提交总是同时改 Makefile 和代码）。
    # 因此 push 时按 head_commit 是否动了 Makefile 决定编不编；PR / 手动触发不受限。
    # head_commit 的文件列表只在单提交 push 下完整 —— 本仓库发版总是单提交。
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.modified, 'Makefile') &&
       !contains(github.event.head_commit.added, 'Makefile') &&
       !contains(github.event.head_commit.removed, 'Makefile'))
    uses: ./.github/workflows/build-packages.yml
