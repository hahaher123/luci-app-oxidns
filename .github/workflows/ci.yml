name: CI

# push / PR 时跑两件事：
#   1) check —— 静态检查与 rpcd 契约测试，秒级完成；
#   2) packages —— 用官方 SDK 真编一次 apk，确认改动还编得出来、产物仍是
#      apk-tools 3 的 ADB 容器格式（见 .github/workflows/build-packages.yml）。
#
# packages 只在会影响到包内容的路径变动时跑：每次 push 都拉一套 SDK 不划算，
# 而只改 README 之类的改动本来也编不出不一样的东西。
on:
  pull_request:
    paths:
      - "Makefile"
      - "htdocs/**"
      - "root/**"
      - "po/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    # 注意：这里的 paths 刻意不含 Makefile。改 Makefile 就是发版，而 release.yml
    # 同样监听 Makefile，它会编译一次并把产物发出去 —— CI 再编一次纯属重复。
    # pull_request 那边保留 Makefile，因为 PR 不会触发 release.yml。
    paths:
      - "htdocs/**"
      - "root/**"
      - "po/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  check:
    name: 静态与契约检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run static checks
        run: scripts/check.sh

      - name: Run integration checks
        run: scripts/integration-check.sh

  packages:
    name: 编译 apk
    needs: check
    uses: ./.github/workflows/build-packages.yml
