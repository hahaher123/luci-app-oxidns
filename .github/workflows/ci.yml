name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run static checks
        run: scripts/check.sh

      - name: Build LuCI packages
        # 版本从 Makefile 读，不写死 —— CI 构建的包必须与 Makefile 声明的版本一致。
        run: scripts/build-luci-package.sh '' dist

      - name: Run integration checks
        run: scripts/integration-check.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-oxidns-packages
          path: dist/*
